[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.2,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "vextest-x86-16"
version = "0.1"
description = "angr-based 16-bit x86 real-mode decompiler workspace"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.14"
dependencies = [
    "angr==9.3.3",
    "archinfo==9.3.3",
    "cle==9.3.3",
    "claripy==9.3.3",
    "pyvex==9.3.3",
    "capstone==5.0.9",
    "pycparser>=3,<4",
    "textual==8.2.8",
    "z3-solver==4.13.0.0",
    "Cython>=3.2,<4",
]

[project.optional-dependencies]
ada = [
    "lark==1.1.9",
]
test = [
    "lark==1.1.9",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "jsonschema>=4,<5",
    "keystone-engine==0.9.2",
    "unicorn==2.1.4",
    "monkeytype",
]
dev = [
    "lark==1.1.9",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "jsonschema>=4,<5",
    "keystone-engine==0.9.2",
    "unicorn==2.1.4",
    "monkeytype",
    "mypy",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "ruff",
    "pyright",
    "vulture",
    "lizard",
]
mypyc = [
    "mypy",
    "setuptools",
]
cython = [
    "Cython>=3.2,<4",
    "setuptools",
]

[project.scripts]
decompile-x86-16 = "decompile:main"
inertia-compiler-id = "tools.compiler_id.cli:main"
inertia-signatures = "tools.signatures.cli:main"
inertia-compiler-coverage = "tools.compiler_toolchain.compiler_coverage_suite:main"
inertia-compare-bc5 = "tools.comparator.bc5_cli:main"
inertia-compare-msc8 = "tools.comparator.msc8_cli:main"
inertia-debugger = "tools.debugger.cli:main"
inertia-ada = "tools.ada_script.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["decompile", "pyvex_compat"]

[tool.setuptools.packages.find]
where = ["."]
include = ["inertia", "inertia.*", "tools", "tools.ada_script", "tools.compiler_id", "tools.comparator", "tools.debugger", "tools.dev", "tools.signatures", "tools.compiler_toolchain", "tools.dosunit", "tools.dosunit.catalog", "tools.dosunit.compare", "tools.dosunit.runtime", "tools.dosunit.reporting", "tools.dosunit.contracts", "tools.dosunit.architectures", "tools.dosunit.ssa", "tools.dosunit.recursive_proofs", "tools.dosunit.recursive_proofs.stack"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "angr_platforms/vextest_x86_16.egg-info",
    "build",
    "dist",
    "examples/build_msc6",
    "examples/build_msc6_tiny",
    "pytest-of-*",
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "ANN",
    # Require documentation, not a particular punctuation/section layout.
    "D1",
    "D419",
    "E",
    "F",
    "I",
    "PERF",
    "B",
    "C4",
    "C901",
    "LOG",
    "PIE",
    "PLR0916",
    "RSE",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "E501",
    # Explicit control flow can be clearer than compressed expressions.
    "SIM108",  # Prefer ternary operator over if/else assignment.
    "SIM110",  # Prefer any()/all() over an explicit loop.
    "PERF401", # Prefer a list comprehension.
    "PERF403", # Prefer a dict comprehension.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-bool-expr = 5

[tool.ruff.lint.per-file-ignores]
"inertia/lowering/analysis_helpers.py" = ["D"]
"inertia/lowering/annotations.py" = ["D"]
"inertia/ir/condition_ir.py" = ["ANN", "D"]
"inertia/frontend/x86_16/lift_86_16.py" = ["ANN", "D"]
"inertia/lowering/condition_transfer.py" = ["D"]
"inertia/lowering/segmented_global_loads.py" = ["D"]
"inertia/lowering/stack_lowering_impl.py" = ["ANN", "D"]
"inertia/pipeline/contracts.py" = ["D"]
"inertia/lowering/segmented_memory_reasoning.py" = ["D"]
"inertia.widening.widening_copyprop_8616" = ["D"]
"inertia.widening.widening_memory_fold_8616" = ["D"]
"inertia.widening.segmented_load_identity" = ["D"]
"inertia.widening.segmented_load_widening" = ["D"]
"inertia/validation/tail_validation_fingerprint.py" = ["ANN", "D"]
"inertia/semantics/callsite_summary.py" = ["D"]
"inertia/postprocess/decompiler_postprocess.py" = ["ANN", "D"]
"inertia/postprocess/decompiler_postprocess_jcc.py" = ["ANN", "D"]
"inertia/postprocess/decompiler_postprocess_utils.py" = ["ANN", "D"]
"inertia/frontend/x86_16/decompiler_return_compat.py" = ["ANN", "D"]
"inertia/frontend/x86_16/render_compat.py" = ["D"]
"inertia/lowering/type_array_matching.py" = ["D"]
"inertia/semantics/stack_probe_fact_trace.py" = ["ANN", "D"]
"inertia/cli/cli.py" = ["D", "F822"] # Lazy exports are resolved by the typed module boundary.
"inertia/cli/cli_c_text_postprocess.py" = ["ANN", "D"]
"inertia/cli/cli_decompilation.py" = ["ANN", "D"]
"inertia/cli/runtime_support.py" = ["ANN", "D"]
"tools/signatures/omf_pat.py" = ["ANN", "D"] # Existing parser debt transferred with its owner.
"tools/dev/decompile_cod_dir.py" = ["ANN", "D", "E402"]
"scripts/*.py" = ["D"]
"tools/compiler_toolchain/build_debug_info_corpus.py" = ["D"]
"tools/compiler_toolchain/probe_compiler_versions.py" = ["D"]
"tools/compiler_toolchain/verify_msc_example_runtime_gate.py" = ["D"]
"tools/dev/auto_decomp_loop.py" = ["D"]
"tools/dev/capture_sortdemo_debug_bundle.py" = ["D"]
"tools/dev/compare_discovery_backends.py" = ["D"]
"tools/dev/run_plan3_checks.py" = ["D"]
"tools/dev/write_recovery_artifact.py" = ["D"]
"tools/signatures/import_patterns.py" = ["D"]
"tools/compiler_id/report.py" = ["D"] # Preserve the pilot's existing script documentation debt.
"tools/*/tests/**/*.py" = ["ANN", "D", "E402"]
"tests/cli/*.py" = ["ANN", "D", "E402"] # Preserve relocated CLI test policy.
"tests/lowering/*.py" = ["ANN", "D", "E402"] # Preserve relocated lowering test policy.
"tests/fixtures/x86_16_condition_definition_fixtures.py" = ["ANN", "D", "E402"] # Preserve the relocated fixture policy.
"tests/integration/*.py" = ["ANN", "D", "E402"] # Preserve the moved tests' existing policy.
"tests/frontend/*.py" = ["ANN", "D", "E402"] # Preserve frontend tests' policy during namespace moves.
"tests/ir/*.py" = ["ANN", "D", "E402"] # Preserve the migrated IR tests' existing policy.
"tests/structuring/*.py" = ["ANN", "D", "E402"]
"tests/postprocess/*.py" = ["ANN", "D", "E402"]
"tests/alias/*.py" = ["ANN", "D", "E402"]
"tests/widening/*.py" = ["ANN", "D", "E402"]
"tests/validation/*.py" = ["ANN", "D", "E402"] # Preserve moved validation test policy.
"tests/semantics/*.py" = ["ANN", "D", "E402"] # Preserve semantic tests' policy during moves.

[tool.mypy]
python_version = "3.14"
mypy_path = ["typings"]
files = [
    "inertia",
    "tools",
    "decompile.py",
    "monkeytype_config.py",
    "tools/signatures/omf_pat.py",
]
strict = true
follow_imports = "skip"
no_site_packages = true
incremental = true
cache_dir = ".mypy_cache"
ignore_missing_imports = true
check_untyped_defs = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
exclude = [
    "build/",
    "dist/",
    "angr_platforms/angr_platforms.egg-info/",
]

[[tool.mypy.overrides]]
module = [
    "inertia.cli.cache_io",
    "inertia.ir.native_stack_anchor",
    "inertia.semantics.callsite_summary",
    "inertia.lowering.linear_global_decomposition_cache",
    "inertia.pipeline.result_contracts",
    "inertia.postprocess.pass_validation_policy",
    "inertia.postprocess.rollback_snapshot_cache",
    "inertia.postprocess.validation_contracts",
    "inertia.validation.control_flow_ast_index",
    "inertia.pipeline.structured_ast_query_index",
    "inertia.lowering.analysis_helpers",
    "inertia.semantics.call_target_identity",
    "inertia.lowering.call_target_ssa_binder",
    "inertia.lowering.call_target_ssa_contracts",
]
follow_imports = "normal"

[tool.pytest.ini_options]
testpaths = [
    "tools/compiler_id/tests",
    "tools/signatures/tests",
    "tools/compiler_toolchain/tests",
    "tools/dosunit/tests",
    "tools/comparator/tests",
    "tools/debugger/tests",
    "tests/integration",
    "tests/frontend",
    "tests/ir",
    "tests/semantics",
    "tests/widening",
    "tests/alias",
    "tests/postprocess",
    "tests/structuring",
    "tests/lowering",
    "tests/validation",
    "tests/cli",
    "tools/dev/tests",
]
markers = [
    "repository_contract: validates current whole-repository state and runs as an explicit hard gate outside focused pytest lanes",
    "resource_serial: requires an exclusive partitioned-suite wave because external tools or shared resources become unreliable under heavy contention",
    "requires_kvm: executes DOS code through /dev/kvm; skips when the current process cannot open the device read-write",
]
addopts = [
    "--durations=10",
    "--durations-min=1.0",
]

[tool.pyright]
include = [
    "inertia",
    "inertia/cli",
]
extraPaths = ["."]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.vulture]
exclude = [
    ".venv/",
    "build/",
    "dist/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
]
ignore_names = [
    "test_*",
    "pytest_*",
]
min_confidence = 80
