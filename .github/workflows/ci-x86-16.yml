name: CI x86-16 Focused Tests

on: [push, pull_request]

jobs:
  x86_16_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.1'

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Run Ruff
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          make ruff

      - name: Run Pyright
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          make pyright

      - name: Run Vulture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          make vulture

      - name: Run Lizard
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          make lizard

      - name: Run Pytest
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          make pytest
